<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Fundo Dark Navy Arredondado -->
  <rect width="100" height="100" rx="20" fill="#0f1a2e" />

  <!-- 4 Cantos HUD (L-Brackets Laranja) -->
  <path d="M 22 32 L 22 22 L 32 22" stroke="#FA7014" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" />
  <path d="M 68 22 L 78 22 L 78 32" stroke="#FA7014" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" />
  <path d="M 22 68 L 22 78 L 32 78" stroke="#FA7014" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" />
  <path d="M 68 78 L 78 78 L 78 68" stroke="#FA7014" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- Retículo Circular Pontilhado Laranja -->
  <circle cx="50" cy="50" r="30" stroke="#FA7014" stroke-width="1.5" stroke-dasharray="3.5 3.5" opacity="0.8" />

  <!-- Estrutura Geométrica do Cubo Isométrico / Malha Facial -->
  <!-- Linhas Internas Laranja -->
  <line x1="50" y1="16" x2="50" y2="36" stroke="#FA7014" stroke-width="2" />
  <line x1="34" y1="26" x2="50" y2="36" stroke="#FA7014" stroke-width="1.8" />
  <line x1="66" y1="26" x2="50" y2="36" stroke="#FA7014" stroke-width="1.8" />
  <line x1="34" y1="46" x2="50" y2="36" stroke="#FA7014" stroke-width="1.8" />
  <line x1="66" y1="46" x2="50" y2="36" stroke="#FA7014" stroke-width="1.8" />

  <!-- Arestas Externas Brancas do Cubo -->
  <path d="M 50 16 L 34 26 L 34 46 L 50 56 L 66 46 L 66 26 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Nós de Vértice Laranja da Malha -->
  <circle cx="50" cy="16" r="3.5" fill="#FA7014" />
  <circle cx="34" cy="26" r="3.5" fill="#FA7014" />
  <circle cx="66" cy="26" r="3.5" fill="#FA7014" />
  <circle cx="50" cy="36" r="3.5" fill="#FA7014" stroke="#FFFFFF" stroke-width="1.2" />

  <!-- Braços Brancos da Catraca Tripé -->
  <line x1="50" y1="56" x2="50" y2="36" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <line x1="50" y1="56" x2="29" y2="74" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <line x1="50" y1="56" x2="71" y2="74" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

  <!-- Pontas dos Braços da Catraca -->
  <circle cx="29" cy="74" r="4.5" fill="#FA7014" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="71" cy="74" r="4.5" fill="#FA7014" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Rotor Central Concêntrico da Catraca -->
  <circle cx="50" cy="56" r="9" fill="#0f1a2e" stroke="#FA7014" stroke-width="3.5" />
  <circle cx="50" cy="56" r="5" fill="#FA7014" />
</svg>
